document.addEventListener("DOMContentLoaded",()=>{let data=[...PRODUCTS];const type="new";const params=new URLSearchParams(location.search);const cat=params.get("cat");if(type==="category"&&cat)data=data.filter(p=>p.category.toLowerCase()===cat.toLowerCase());if(type==="trending")data=data.filter(p=>p.trending);if(type==="deals")data=data.filter(p=>p.originalPrice&&((1-p.price/p.originalPrice)*100)>=20);function update(){let q=(document.querySelector("#listSearch")?.value||"").toLowerCase();let s=document.querySelector("#sort")?.value||"new";let d=data.filter(p=>(p.name+" "+p.category+" "+p.brand+" "+p.tags.join(" ")).toLowerCase().includes(q));if(s==="trend")d.sort((a,b)=>Number(b.trending)-Number(a.trending));if(s==="low")d.sort((a,b)=>a.price-b.price);if(s==="high")d.sort((a,b)=>b.price-a.price);if(s==="new")d.sort((a,b)=>b.dateAdded.localeCompare(a.dateAdded));document.querySelector("#listing").innerHTML=d.map(card).join("")||'<div class="empty">No matching finds.</div>';bindAffiliate()}update();document.querySelector("#listSearch")?.addEventListener("input",update);document.querySelector("#sort")?.addEventListener("change",update);});
