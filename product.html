<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Outfits Here</title><meta name="description" content="Curated fashion product from Outfits Here."><meta property="og:type" content="product"><link rel="stylesheet" href="styles.css"></head><body data-page="detail"><div class="announcement">✨ New Fashion Finds Added Daily</div><header class="site-header"><a class="logo" href="index.html">Outfits <span>Here</span></a><nav class="desktop-nav"><a href="index.html">Home</a><a href="new-arrivals.html">New Arrivals</a><a href="category.html?cat=Men">Men</a><a href="category.html?cat=Women">Women</a><a href="category.html?cat=Shoes">Shoes</a><a href="category.html?cat=Accessories">Accessories</a><a href="trending.html">Trending</a></nav><div class="header-actions"><button class="icon-btn" id="openSearch">⌕</button><button class="icon-btn menu-btn" id="menuBtn">☰</button></div></header><main id="detail"></main><footer id="footer"></footer><script src="products.js"></script><script src="app.js"></script><script>
document.addEventListener("DOMContentLoaded",()=>{const id=new URLSearchParams(location.search).get("id");const p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];document.title=p.name+" — Outfits Here";document.querySelector('meta[name="description"]').content=p.description;document.querySelector("#detail").innerHTML=`<section class="product-detail"><div class="detail-image"><img src="${p.image}" alt="${esc(p.name)}"></div><div class="detail-copy"><span class="eyebrow">${esc(p.category)} · ${esc(p.brand)}</span><h1>${esc(p.name)}</h1><p>${esc(p.description)}</p><div class="price-row"><span class="price">${money(p.price)}</span>${p.originalPrice?`<span class="original">${money(p.originalPrice)}</span><span class="save">Save ${discount(p)}%</span>`:""}</div><div class="features"><b>Why it’s here</b><ul><li>Curated as a fashion discovery pick.</li><li>Check the retailer for current price, size and availability.</li><li>Shop directly from the retailer using the button below.</li></ul></div><button class="shop-btn" data-affiliate="${p.id}">🛍️ View Product</button><p class="disclosure">Affiliate disclosure: this link may earn Outfits Here a commission at no additional cost to you. Price and availability may change on the retailer’s website.</p></div></section><section class="section soft"><div class="section-head"><h2>Related Finds</h2></div><div class="product-grid">${PRODUCTS.filter(x=>x.id!==p.id&&x.category===p.category).slice(0,4).map(card).join("")}</div></section>`;document.querySelectorAll("[data-affiliate]").forEach(b=>b.addEventListener("click",()=>{trackClick(p);location.href=p.affiliateUrl})) ;});
</script></body></html>
